<!doctype html>
<!-- first load: this page (inline CSS) + app.js; other views load by import() -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>make.fun bounties</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://make.fun" crossorigin>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f4ee,#0e1014);--card:light-dark(#fff,#181b21);--line:light-dark(#e7e1d6,#2b3039);--fg:light-dark(#17140f,#eceef2);--mute:light-dark(#666057,#a0a6b1);--pot:light-dark(#0a7a42,#3fdc85);--warn:light-dark(#9a5800,#f2b34c);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
[data-theme=dark]{color-scheme:dark}[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg)}
a{color:inherit;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--pot);outline-offset:2px;border-radius:6px}
header,main,footer{max-width:1240px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:8px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
header>a{font-weight:800;font-size:1.1rem;text-decoration:none;margin-right:8px}
header>a b,.pot{color:var(--pot)}
nav{display:contents}
nav span{display:flex;gap:4px;flex-wrap:wrap}
#q{width:190px;cursor:text}
#order,nav:empty+#theme{margin-left:auto}
#theme::before{content:"";display:block;width:14px;height:14px;margin:2px -2px;border:2px solid;border-radius:50%;box-shadow:inset 5px 0 currentColor}
#cats button{border-radius:99px}
#cats small{color:inherit;opacity:.6}
button,select,input{font:inherit;font-size:.87rem;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}
h1{font-size:1.5rem;line-height:1.25;margin:.2em 0}
h2{font-size:1.05rem;margin:1.2em 0 .5em}
.mute,small{color:var(--mute)}
.lede{font-size:1.1rem;font-weight:600;color:var(--mute);margin:0 0 14px}
.lede b,.lede a{color:var(--fg)}
.lede .pot{font-size:3rem;margin-right:4px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));padding:0;margin:0;list-style:none}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card{display:flex;flex-direction:column;gap:4px}
.card.closed{opacity:.6}
.card.closed .pot{color:var(--mute)}
.urgent{box-shadow:inset 0 3px var(--warn)}
.urgent [data-ends]{color:var(--warn)}
.card h3{margin:0;font-size:.98rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.8rem;color:var(--mute)}
.pill{border-radius:99px;padding:1px 8px;font-weight:700;font-size:.74rem;background:color-mix(in srgb,currentColor 13%,transparent);white-space:nowrap}
.open{color:var(--pot)}.soon{color:var(--warn)}.shut{color:var(--mute)}
.pot{font-size:2.7rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.pot small{font-size:.78rem;font-weight:600;letter-spacing:0;margin-left:6px}
.facts{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.35fr) minmax(0,.9fr);gap:8px;margin:0}
.card .facts{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.facts div{min-width:0}
dt,th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.facts dd{margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pot);margin-right:5px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.flash{animation:flash 1.2s}
@keyframes flash{from{background:color-mix(in srgb,var(--pot) 35%,transparent)}}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px}
.box h2{margin:0 0 6px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.n{text-align:right}
.rk{display:inline-block;min-width:1.9em;padding:0 6px;border-radius:99px;text-align:center;font-weight:800}
.p{background:color-mix(in srgb,var(--pot) 16%,transparent);color:var(--pot)}
.p1{background:var(--pot);color:var(--card)}
.prose{max-width:75ch;overflow-wrap:anywhere}
.prose pre{overflow:auto;background:var(--card);padding:10px;border-radius:8px}
.prose code{font-size:.9em}
details{margin:12px 0}
summary{cursor:pointer;font-weight:700}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
footer{padding-top:24px;padding-bottom:24px;font-size:.8rem;color:var(--mute)}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--line)}
@media (max-width:820px){.lede .pot{font-size:2.2rem}.card h3{min-height:0}.cols{grid-template-columns:1fr}.side{position:static}.pot{font-size:2.2rem}td.t{display:none}#cats{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script>try{document.documentElement.dataset.theme=/[?&#]theme=(dark|light)/.exec(location.href)?.[1]||localStorage.getItem('mf:theme')||''}catch{}</script>
<script type="module" src="app.js"></script>
</head>
<body>
<header><a href="#/">make<b>.fun</b> bounties</a>
<nav id="sort" aria-label="Find and sort bounties"></nav><button id="theme" type="button" aria-label="Switch between light and dark theme" title="Light or dark theme"></button></header>
<main id="app" tabindex="-1">Loading live bounties…</main>
<footer id="meter"></footer>
</body>
</html>
