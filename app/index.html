<!doctype html>
<!-- one-file first paint -->
<html lang=en>
<meta name=viewport content=width=device-width>
<title>Fast Board: the make.fun board in 0.8 KB</title>
<style>
:root{color-scheme:light dark;font:15px system-ui;background:light-dark(#f7f4ee,#0e1014);max-width:1240px;margin:auto}
a{color:inherit;text-decoration:none}
b{color:light-dark(#0a7a42,#3fdc85)}
.rows{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.rows>a{display:grid;grid:auto/1fr auto;gap:4px;padding:9px;border-radius:9px;background:#8882}
</style>
<header><a href=#/>Fast Board: the make.fun board in 0.8 KB</a></header>
<main id=app class=rows>
<script>
var M=v=>'$'+(+v).toLocaleString('en'),
L=t=>(t=(Date.parse(t)-Date.now())/36e5)>0?`${t/24|0}d ${t%24|0}h`:'ended',
row=c=>`<a href=#/bounty/${c.slug}>${c.title.replace(/</g,'&lt;')}<b>${M(c.potUsd)}</b>${+c.entryFeeUsd?M(c.entryFeeUsd)+' fee':'Free'}<span data-ends=${c.deadline}>${L(c.deadline)}</span></a>`,
B=fetch('https://make.fun/api/competitions?status=open&activity=times').then(r=>r.json());
B.then(j=>{app.innerHTML=j.items.sort((a,b)=>a.deadline<b.deadline||-1).map(row).join('');performance.mark('paint')}).finally(_=>import('./shell.js'))
</script>
