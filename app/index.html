<!doctype html>
<!-- make.fun bounties: whole first load = this page (inline CSS) + app.js; bounty, leaderboard and profile views load by import() -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>make.fun bounties</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://make.fun" crossorigin>
<style>
:root{--bg:#0d1016;--card:#161b24;--line:#283040;--fg:#eef1f6;--mute:#a3acbc;--pot:#3ee08f;--acc:#7cb0ff;--warn:#ffb648;--bad:#ff7b7b;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--line:#d9dee8;--fg:#111620;--mute:#4f5868;--pot:#0a7d45;--acc:#1f5fd1;--warn:#a35a00;--bad:#b42323;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg)}
a{color:var(--acc)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
header,main,footer{max-width:1240px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
header>a{color:var(--fg);font-weight:800;font-size:1.15rem;text-decoration:none}
header>a b{color:var(--pot)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer}
button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:700}
button:disabled{opacity:.45;cursor:default}
h1{font-size:1.5rem;line-height:1.25;margin:.2em 0}
h2{font-size:1.1rem;margin:1.2em 0 .5em}
.mute,small{color:var(--mute)}
.picks{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:.92rem}
.picks a{flex:1 1 220px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;text-decoration:none;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picks b{color:var(--pot)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));padding:0;margin:0;list-style:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.closed{opacity:.72}
.card h3{margin:0;font-size:1rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card h3 a{color:var(--fg);text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--mute)}
.pill{border-radius:99px;padding:1px 9px;font-weight:700;font-size:.78rem;border:1px solid currentColor;white-space:nowrap}
.open{color:var(--pot)}.soon{color:var(--warn)}.shut{color:var(--bad)}
.pot{font-size:2rem;font-weight:800;color:var(--pot);line-height:1.1;font-variant-numeric:tabular-nums}
.pot small{font-size:.8rem;font-weight:600;margin-left:6px}
.facts{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.35fr) minmax(0,.9fr);gap:8px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.facts dd{margin:0;font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;white-space:nowrap}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pot);margin-right:6px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.flash{animation:flash 1.2s}
@keyframes flash{from{background:color-mix(in srgb,var(--pot) 35%,transparent)}}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h2{margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;color:var(--mute)}
td.n,th.n{text-align:right}
.prose{max-width:75ch;overflow-wrap:anywhere}
.prose pre{overflow:auto;background:var(--card);padding:10px;border-radius:8px}
.prose code{font-size:.9em}
details{margin:12px 0}
summary{cursor:pointer;font-weight:700}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
footer{padding-top:24px;padding-bottom:24px;font-size:.82rem;color:var(--mute)}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--line)}
@media (max-width:820px){.cols{grid-template-columns:1fr}.side{position:static}.pot{font-size:1.7rem}td.t{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<script type="module" src="app.js"></script>
</head>
<body>
<header><a href="#/">make<b>.fun</b> bounties</a><nav id="sort" aria-label="Sort and filter bounties"></nav></header>
<main id="app" tabindex="-1"><p>Loading live bounties…</p></main>
<footer id="meter" aria-live="off"></footer>
</body>
</html>
